name: Release workflow for tagged versions
on:
  release:
    types:
      - published

env:
  COMPOSE_DOCKER_CLI_BUILD: 1

jobs:
  builder_images:
    strategy:
      matrix:
        include:
          - baseimage: rockylinux
            version: "8"
            image: rockylinux/rockylinux:8
            arch: amd64
          - baseimage: rockylinux
            version: "9"
            image: rockylinux/rockylinux:9
            arch: amd64
          - baseimage: rockylinux
            version: "10"
            image: rockylinux/rockylinux:10
            arch: amd64
          - baseimage: fedora
            version: "43"
            image: fedora:43
            arch: amd64
          - baseimage: fedora
            version: "44"
            image: fedora:44
            arch: amd64
          - baseimage: opensuse-leap
            version: "16.0"
            image: opensuse/leap:16.0
            arch: amd64
          - baseimage: rockylinux
            version: "8"
            image: rockylinux/rockylinux:8
            arch: arm64
          - baseimage: rockylinux
            version: "9"
            image: rockylinux/rockylinux:9
            arch: arm64
          - baseimage: rockylinux
            version: "10"
            image: rockylinux/rockylinux:10
            arch: arm64
          - baseimage: fedora
            version: "43"
            image: fedora:43
            arch: arm64
          - baseimage: fedora
            version: "44"
            image: fedora:44
            arch: arm64
          - baseimage: opensuse-leap
            version: "16.0"
            image: opensuse/leap:16.0
            arch: arm64
    env:
      IMAGEARTIFACT: builder-${{ matrix.baseimage }}-${{ matrix.version }}-${{ matrix.arch }}
      IMAGETAG: builder-${{ matrix.baseimage }}:${{ matrix.version }}
    # run on a runner of the target arch (native arm64 runners are free for public repos), no QEMU
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@v7

      # https://github.com/docker/setup-buildx-action
      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: docker/rpmtools
          platforms: 'linux/${{ matrix.arch }}'
          build-args: |
            BASEIMAGE=${{ matrix.image }}
          tags: ${{ env.IMAGETAG }}
          outputs: type=docker,dest=${{ runner.temp }}/myimage.tar

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.IMAGEARTIFACT }}
          path: ${{ runner.temp }}/myimage.tar

  build_specs:
    strategy:
      matrix:
        arch:
          - arm64
          - amd64
    env:
      IMAGETAG: builder-${{ matrix.baseimage }}:${{ matrix.version }}
    # run on a runner of the target arch (native arm64 runners are free for public repos), no QEMU
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@v7

      # https://github.com/docker/setup-buildx-action
      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v4

      - name: update to docker-compose v2
        run: |
          sudo apt-get install -y curl
          sudo curl -SL https://github.com/docker/compose/releases/download/v2.34.0/docker-compose-linux-$(uname -m) -o /usr/local/bin/docker-compose
          sudo chmod +x /usr/local/bin/docker-compose
          docker-compose --version

      - name: create rpms and specs folders as required
        run: |
          mkdir -p rpms specs
          chmod 777 rpms specs

      - name: generate specs
        run: |
          docker-compose up specgen --exit-code-from specgen
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCKER_DEFAULT_PLATFORM: linux/${{ matrix.arch }}
          DOCKER_BUILDKIT: 1

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.arch }}-specs
          path: specs/

  build_matrix:
    needs:
      - build_specs
    outputs:
      mymatrix: ${{ steps.matrix.outputs.mymatrix }}
    runs-on: ubuntu-latest
    steps:

      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: arm64-specs
          path: specs/

      - uses: actions/download-artifact@v8
        with:
          name: amd64-specs
          path: specs/

      - id: matrix
        run: |
          scripts/speclist_as_json.sh
          scripts/speclist_as_json.sh >> $GITHUB_OUTPUT

  build_rpms:
    strategy:
      # one failing distro or package should not cancel the builds for the others
      fail-fast: false
      matrix: ${{ fromJson(needs.build_matrix.outputs.mymatrix) }}

    # run on a runner of the target arch (native arm64 runners are free for public repos), no QEMU
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    needs:
      - builder_images
      - build_matrix
    env:
      IMAGETAG: builder-${{ matrix.baseimage }}:${{ matrix.version }}
      IMAGEARTIFACT: builder-${{ matrix.baseimage }}-${{ matrix.version }}-${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.arch }}-specs
          path: all/

      - name: copy the spec to the place
        run: |
          rm -rf specs && mkdir specs
          cp all/${{ matrix.spec }} specs/

      # https://github.com/docker/setup-buildx-action
      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v4

      - name: update to docker-compose v2
        run: |
          sudo apt-get install -y curl
          sudo curl -SL https://github.com/docker/compose/releases/download/v2.34.0/docker-compose-linux-$(uname -m) -o /usr/local/bin/docker-compose
          sudo chmod +x /usr/local/bin/docker-compose
          docker-compose --version

      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.IMAGEARTIFACT }}
          path: ${{ runner.temp }}

      - name: load image
        run: |
          docker load --input ${{ runner.temp }}/myimage.tar

      - name: create rpms folder as required
        run: |
          mkdir -p rpms
          chmod 777 rpms

      - name: build rpm
        run: |
          docker-compose up rpmbuilder --exit-code-from rpmbuilder

        env:
          DOCKER_DEFAULT_PLATFORM: linux/${{ matrix.arch }}
          DOCKER_BUILDKIT: 1

      - name: sign rpm's
        run: |
          docker-compose up rpmsigner --exit-code-from rpmsigner
        env:
         GPG_PASSPHRASE: "${{ secrets.GPG_PASSPHRASE }}"
         GPG_KEY_B64: "${{ secrets.GPG_KEY_B64 }}"

      # the package job merges these into one tarball per distro release
      - name: sort rpm's by distro and arch
        run: |
          mkdir -p "out/${{ matrix.distro }}/${{ matrix.arch == 'arm64' && 'aarch64' || 'x86_64' }}"
          cp rpms/*.rpm "out/${{ matrix.distro }}/${{ matrix.arch == 'arm64' && 'aarch64' || 'x86_64' }}/"

      - uses: actions/upload-artifact@v7
        with:
          name: rpms-${{ matrix.distro }}-${{ matrix.arch }}-${{ matrix.spec }}
          path: out/
          if-no-files-found: error

  package:
    needs:
      - build_rpms
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          pattern: rpms-*
          path: out/
          merge-multiple: true

      - name: create one tarball per distro release
        run: scripts/package_rpms.sh out "${{ github.ref_name }}" dist

      - name: Add tarballs to release
        uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/*
