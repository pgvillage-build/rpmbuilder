name: Minimal workflow for CI/CD
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  # The required checks also run in the merge queue: the tested commit is what lands on main
  merge_group:

env:
  COMPOSE_DOCKER_CLI_BUILD: 1

jobs:
  # Builds all specs when any other file than the package list changed, else only the entries that changed in
  # config/github2spec.yaml. Outside of pull requests (the merge queue) it always builds everything.
  changes:
    runs-on: ubuntu-latest
    outputs:
      all: ${{ steps.changes.outputs.all }}
      generate: ${{ steps.changes.outputs.generate }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: find the packages this PR changes
        id: changes
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          ALL=false
          [ "${EVENT}" = pull_request ] && BASE=$(git merge-base "origin/${BASE_REF}" HEAD)
          if [ "${EVENT}" != pull_request ] ||
            git diff --name-only "${BASE}" HEAD | grep -qvxF 'config/github2spec.yaml' ||
            ! git show "${BASE}:config/github2spec.yaml" > "${RUNNER_TEMP}/base.yaml"; then
            ALL=true
            echo "Building all packages"
          else
            # same specbuilder image as the specgen service in docker-compose.yml
            GENERATE=$(docker run --rm --entrypoint /specbuilder -v "${PWD}:/host" -v "${RUNNER_TEMP}:/base" \
              ghcr.io/pgvillage-tools/specbuilder:latest \
              -config /host/config/github2spec.yaml -changed /base/base.yaml | xargs)
            echo "Generating: ${GENERATE:-nothing}"
          fi
          {
            echo "all=${ALL}"
            echo "generate=${GENERATE}"
          } >> "$GITHUB_OUTPUT"

  # the newest release of every distro (from endoflife.date) that has a container image, see scripts/distro_releases.sh
  distros:
    runs-on: ubuntu-latest
    outputs:
      builders: ${{ steps.distros.outputs.builders }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: find the distro releases to build for
        id: distros
        run: |
          BUILDERS=$(scripts/distro_releases.sh --minimal)
          echo "Building on ${BUILDERS}"
          echo "builders=${BUILDERS}" >> "$GITHUB_OUTPUT"

  builder_images:
    needs:
      - distros
    strategy:
      matrix:
        include: ${{ fromJSON(needs.distros.outputs.builders) }}
    env:
      IMAGEARTIFACT: builder-${{ matrix.baseimage }}-${{ matrix.version }}-${{ matrix.arch }}
      IMAGETAG: builder-${{ matrix.baseimage }}:${{ matrix.version }}
    # run on a runner of the target arch (native arm64 runners are free for public repos), no QEMU
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # https://github.com/docker/setup-buildx-action
      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: docker/rpmtools
          platforms: 'linux/${{ matrix.arch }}'
          build-args: |
            BASEIMAGE=${{ matrix.image }}
          tags: ${{ env.IMAGETAG }}
          outputs: type=docker,dest=${{ runner.temp }}/myimage.tar

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.IMAGEARTIFACT }}
          path: ${{ runner.temp }}/myimage.tar

  build_specs:
    needs:
      - changes
    if: needs.changes.outputs.all == 'true' || needs.changes.outputs.generate != ''
    strategy:
      matrix:
        arch:
          - arm64
          - amd64
    # run on a runner of the target arch (native arm64 runners are free for public repos), no QEMU
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # https://github.com/docker/setup-buildx-action
      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Uses the docker compose plugin of the runner, instead of a download from GitHub releases
      - name: show the docker compose version
        run: docker compose version

      - name: create rpms and specs folders as required
        run: |
          mkdir -p specs
          chmod 777 specs

      - name: generate specs
        run: |
          docker compose up specgen --exit-code-from specgen
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCKER_DEFAULT_PLATFORM: linux/${{ matrix.arch }}
          DOCKER_BUILDKIT: 1
          # empty generates all specs
          SPECBUILDER_ONLY: ${{ needs.changes.outputs.all != 'true' && needs.changes.outputs.generate || '' }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.arch }}-specs
          path: specs/

  build_matrix:
    needs:
      - distros
      - build_specs
    outputs:
      mymatrix: ${{ steps.matrix.outputs.mymatrix }}
    runs-on: ubuntu-latest
    steps:

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: arm64-specs
          path: specs/

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: amd64-specs
          path: specs/

      - id: matrix
        run: |
          scripts/speclist_as_json.sh
          scripts/speclist_as_json.sh >> $GITHUB_OUTPUT
        env:
          BUILDERS: ${{ needs.distros.outputs.builders }}

  build-rpms:
    strategy:
      # one failing distro or package should not cancel the builds for the others
      fail-fast: false
      matrix: ${{ fromJson(needs.build_matrix.outputs.mymatrix) }}

    # run on a runner of the target arch (native arm64 runners are free for public repos), no QEMU
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    needs:
      - builder_images
      - build_matrix
    env:
      IMAGETAG: builder-${{ matrix.baseimage }}:${{ matrix.version }}
      IMAGEARTIFACT: builder-${{ matrix.baseimage }}-${{ matrix.version }}-${{ matrix.arch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ matrix.arch }}-specs
          path: all/

      - name: copy the spec to the place
        run: |
          rm -rf specs && mkdir specs
          find all
          cp all/${{ matrix.spec }} specs/

      # https://github.com/docker/setup-buildx-action
      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Uses the docker compose plugin of the runner, instead of a download from GitHub releases
      - name: show the docker compose version
        run: docker compose version

      - name: Download artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ env.IMAGEARTIFACT }}
          path: ${{ runner.temp }}

      - name: load image
        run: |
          docker load --input ${{ runner.temp }}/myimage.tar

      - name: create rpms folder as required
        run: |
          mkdir -p rpms
          chmod 777 rpms

      - name: build rpm
        run: |
          docker compose up rpmbuilder --exit-code-from rpmbuilder
        env:
          DOCKER_DEFAULT_PLATFORM: linux/${{ matrix.arch }}
          DOCKER_BUILDKIT: 1

      - name: sign rpm's
        if: ${{ env.GPG_KEY_B64 != '' }}
        run: |
          docker compose up rpmsigner --exit-code-from rpmsigner
        env:
         GPG_PASSPHRASE: "${{ secrets.GPG_PASSPHRASE }}"
         GPG_KEY_B64: "${{ secrets.GPG_KEY_B64 }}"

      # the package job merges these into one tarball per distro release
      - name: sort rpm's by distro and arch
        run: |
          mkdir -p "out/${{ matrix.distro }}/${{ matrix.arch == 'arm64' && 'aarch64' || 'x86_64' }}"
          cp rpms/*.rpm "out/${{ matrix.distro }}/${{ matrix.arch == 'arm64' && 'aarch64' || 'x86_64' }}/"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rpms-${{ matrix.distro }}-${{ matrix.arch }}-${{ matrix.spec }}
          path: out/
          if-no-files-found: error

  # same as the release workflow, but keeps the tarballs as a workflow artifact
  package:
    needs:
      - build-rpms
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: rpms-*
          path: out/
          merge-multiple: true

      - name: install createrepo_c
        run: sudo apt-get update && sudo apt-get install -y createrepo-c

      # zypper needs a signed repomd.xml; the repo server serves these repodata as is
      - name: create and sign the repodata
        run: scripts/createrepo.sh out
        env:
          GPG_PASSPHRASE: "${{ secrets.GPG_PASSPHRASE }}"
          GPG_KEY_B64: "${{ secrets.GPG_KEY_B64 }}"

      - name: create one tarball per distro release
        run: scripts/package_rpms.sh out "${VERSION}" dist
        env:
          # the merge queue has no PR number
          VERSION: ${{ github.event_name == 'pull_request' && format('pr{0}', github.event.number) || format('mq-{0}', github.sha) }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tarballs
          path: dist/

  # Jobs are skipped when nothing needs building, or when a job they need failed: so check all of them.
  check-build-rpms-status:
    runs-on: ubuntu-latest
    needs:
      - changes
      - distros
      - builder_images
      - build_specs
      - build_matrix
      - build-rpms
      - package
    if: always()
    steps:
      - name: Evaluate build-rpm status
        run: |
          echo '${{ toJSON(needs.*.result) }}'
          for RESULT in ${{ join(needs.*.result, ' ') }}; do
            case "$RESULT" in
              success | skipped) ;;
              failure) exit 1 ;;
              *) echo "Tests were cancelled."; exit 1 ;;
            esac
          done

  # The only required check of this workflow, so the ruleset doesn't change when jobs are added. It must always run,
  # and only passes when every job it needs succeeded (a skipped required check would count as a pass).
  # check-build-rpms-status stays until the ruleset requires this check instead.
  ci-result:
    name: CI result
    runs-on: ubuntu-latest
    needs:
      - changes
      - distros
      - builder_images
      - build_specs
      - build_matrix
      - build-rpms
      - package
      - check-build-rpms-status
    if: always()
    steps:
      - name: Evaluate the results
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
          EVENT: ${{ github.event_name }}
        run: |
          echo "Results: ${RESULTS} (event: ${EVENT})"
          # A job skipped by a path filter is fine on a pull request; everywhere else everything must run
          if [ "${EVENT}" = pull_request ]; then ok='. == "success" or . == "skipped"'; else ok='. == "success"'; fi
          if [ "$(echo "${RESULTS}" | jq -r "all(${ok})")" != true ]; then
            echo "::error::All CI jobs must succeed"
            exit 1
          fi
