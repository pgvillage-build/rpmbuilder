name: Minimal workflow for CI/CD
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

env:
  COMPOSE_DOCKER_CLI_BUILD: 1

jobs:
  # Builds all specs when any other file than the package list changed, else only the entries that changed in
  # config/github2spec.yaml.
  changes:
    runs-on: ubuntu-latest
    outputs:
      all: ${{ steps.changes.outputs.all }}
      generate: ${{ steps.changes.outputs.generate }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: find the packages this PR changes
        id: changes
        run: |
          BASE=$(git merge-base "origin/${{ github.base_ref }}" HEAD)
          ALL=false
          if git diff --name-only "${BASE}" HEAD | grep -qvxF 'config/github2spec.yaml' ||
            ! git show "${BASE}:config/github2spec.yaml" > "${RUNNER_TEMP}/base.yaml"; then
            ALL=true
            echo "Building all packages"
          else
            # same specbuilder image as the specgen service in docker-compose.yml
            GENERATE=$(docker run --rm --entrypoint /specbuilder -v "${PWD}:/host" -v "${RUNNER_TEMP}:/base" \
              ghcr.io/pgvillage-tools/specbuilder:latest \
              -config /host/config/github2spec.yaml -changed /base/base.yaml | xargs)
            echo "Generating: ${GENERATE:-nothing}"
          fi
          {
            echo "all=${ALL}"
            echo "generate=${GENERATE}"
          } >> "$GITHUB_OUTPUT"

  builder_images:
    strategy:
      matrix:
        include:
          #- baseimage: rockylinux
          #  version: "9"
          #  arch: amd64
          #- baseimage: rockylinux
          #  version: "9"
          #  arch: amd64
          #- baseimage: fedora
          #  version: "39"
          #  arch: amd64
          #- baseimage: fedora
          #  version: "40"
          #  arch: amd64
          #- baseimage: fedora
          #  version: "41"
          #  arch: amd64
          - baseimage: fedora
            version: "42"
            arch: amd64
          #- baseimage: rockylinux
          #  version: "8"
          #  arch: arm64
          - baseimage: rockylinux
            version: "9"
            arch: arm64
          #- baseimage: fedora
          #  version: "39"
          #  arch: arm64
          #- baseimage: fedora
          #  version: "40"
          #  arch: arm64
          #- baseimage: fedora
          #  version: "41"
          #  arch: arm64
          #- baseimage: fedora
          #  version: "42"
          #  arch: arm64
    env:
      IMAGEARTIFACT: builder-${{ matrix.baseimage }}-${{ matrix.version }}-${{ matrix.arch }}
      IMAGETAG: builder-${{ matrix.baseimage }}:${{ matrix.version }}
    # run on a runner of the target arch (native arm64 runners are free for public repos), no QEMU
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@v7

      # https://github.com/docker/setup-buildx-action
      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: docker/rpmtools
          platforms: 'linux/${{ matrix.arch }}'
          build-args: |
            BASEIMAGE=${{ matrix.baseimage }}:${{ matrix.version }}
          tags: ${{ env.IMAGETAG }}
          outputs: type=docker,dest=${{ runner.temp }}/myimage.tar

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.IMAGEARTIFACT }}
          path: ${{ runner.temp }}/myimage.tar

  build_specs:
    needs:
      - changes
    if: needs.changes.outputs.all == 'true' || needs.changes.outputs.generate != ''
    strategy:
      matrix:
        arch:
          - arm64
          - amd64
    env:
      IMAGETAG: builder-${{ matrix.baseimage }}:${{ matrix.version }}
    # run on a runner of the target arch (native arm64 runners are free for public repos), no QEMU
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@v7

      # https://github.com/docker/setup-buildx-action
      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v4

      - name: update to docker-compose v2
        run: |
          sudo apt-get install -y curl
          sudo curl -SL https://github.com/docker/compose/releases/download/v2.34.0/docker-compose-linux-$(uname -m) -o /usr/local/bin/docker-compose
          sudo chmod +x /usr/local/bin/docker-compose
          docker-compose --version

      - name: create rpms and specs folders as required
        run: |
          mkdir -p specs
          chmod 777 specs

      - name: generate specs
        run: |
          docker-compose up specgen --exit-code-from specgen
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCKER_DEFAULT_PLATFORM: linux/${{ matrix.arch }}
          DOCKER_BUILDKIT: 1
          # empty generates all specs
          SPECBUILDER_ONLY: ${{ needs.changes.outputs.all != 'true' && needs.changes.outputs.generate || '' }}

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.arch }}-specs
          path: specs/

  build_matrix:
    needs:
      - build_specs
    outputs:
      mymatrix: ${{ steps.matrix.outputs.mymatrix }}
    runs-on: ubuntu-latest
    steps:

      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: arm64-specs
          path: specs/

      - uses: actions/download-artifact@v8
        with:
          name: amd64-specs
          path: specs/

      - id: matrix
        run: |
          scripts/speclist_as_json.sh --minimal
          scripts/speclist_as_json.sh --minimal >> $GITHUB_OUTPUT

  build-rpms:
    strategy:
      matrix: ${{ fromJson(needs.build_matrix.outputs.mymatrix) }}

    # run on a runner of the target arch (native arm64 runners are free for public repos), no QEMU
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    needs:
      - builder_images
      - build_matrix
    env:
      IMAGETAG: builder-${{ matrix.baseimage }}:${{ matrix.version }}
      IMAGEARTIFACT: builder-${{ matrix.baseimage }}-${{ matrix.version }}-${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.arch }}-specs
          path: all/

      - name: copy the spec to the place
        run: |
          rm -rf specs && mkdir specs
          find all
          cp all/${{ matrix.spec }} specs/

      # https://github.com/docker/setup-buildx-action
      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v4

      - name: update to docker-compose v2
        run: |
          sudo apt-get install -y curl
          sudo curl -SL https://github.com/docker/compose/releases/download/v2.34.0/docker-compose-linux-$(uname -m) -o /usr/local/bin/docker-compose
          sudo chmod +x /usr/local/bin/docker-compose
          docker-compose --version

      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.IMAGEARTIFACT }}
          path: ${{ runner.temp }}

      - name: load image
        run: |
          docker load --input ${{ runner.temp }}/myimage.tar

      - name: create rpms folder as required
        run: |
          mkdir -p rpms
          chmod 777 rpms

      - name: build rpm
        run: |
          docker-compose up rpmbuilder --exit-code-from rpmbuilder
        env:
          DOCKER_DEFAULT_PLATFORM: linux/${{ matrix.arch }}
          DOCKER_BUILDKIT: 1

      - name: sign rpm's
        if: ${{ env.GPG_KEY_B64 != '' }}
        run: |
          docker-compose up rpmsigner --exit-code-from rpmsigner
        env:
         GPG_PASSPHRASE: "${{ secrets.GPG_PASSPHRASE }}"
         GPG_KEY_B64: "${{ secrets.GPG_KEY_B64 }}"

      # the package job merges these into one tarball per distro release
      - name: sort rpm's by distro and arch
        run: |
          mkdir -p "out/${{ matrix.distro }}/${{ matrix.arch == 'arm64' && 'aarch64' || 'x86_64' }}"
          cp rpms/*.rpm "out/${{ matrix.distro }}/${{ matrix.arch == 'arm64' && 'aarch64' || 'x86_64' }}/"

      - uses: actions/upload-artifact@v7
        with:
          name: rpms-${{ matrix.distro }}-${{ matrix.arch }}-${{ matrix.spec }}
          path: out/
          if-no-files-found: error

  # same as the release workflow, but keeps the tarballs as a workflow artifact
  package:
    needs:
      - build-rpms
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          pattern: rpms-*
          path: out/
          merge-multiple: true

      - name: create one tarball per distro release
        run: scripts/package_rpms.sh out "pr${{ github.event.number }}" dist

      - uses: actions/upload-artifact@v7
        with:
          name: tarballs
          path: dist/

  # Jobs are skipped when nothing needs building, or when a job they need failed: so check all of them.
  check-build-rpms-status:
    runs-on: ubuntu-latest
    needs:
      - changes
      - builder_images
      - build_specs
      - build_matrix
      - build-rpms
      - package
    if: always()
    steps:
      - name: Evaluate build-rpm status
        run: |
          echo '${{ toJSON(needs.*.result) }}'
          for RESULT in ${{ join(needs.*.result, ' ') }}; do
            case "$RESULT" in
              success | skipped) ;;
              failure) exit 1 ;;
              *) echo "Tests were cancelled."; exit 1 ;;
            esac
          done
