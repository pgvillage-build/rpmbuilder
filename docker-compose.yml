services:
  specgen:
    image: ghcr.io/pgvillage-tools/specbuilder:${SPECBUILDER_VERSION:-latest}
    # specs in a git checkout belong to the host user, so run as root to be able to overwrite them
    user: root
    volumes:
      - ./:/host
    environment:
      GITHUB2SPEC_CONFIG: /host/config/github2spec.yaml
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
  rpmbuilder:
    image: ${IMAGETAG}
    command:
      - /host/scripts/build_rpms.sh
    volumes:
      - ./:/host
  rpmdownloader:
    image: ${IMAGETAG}
    command:
      - /host/scripts/download_rpms.sh
    volumes:
      - ./:/host
  rpmsigner:
    image: ${IMAGETAG}
    command:
      - /host/scripts/sign_rpms.sh
    volumes:
      - ./:/host
    environment:
      - GPG_PASSPHRASE
      - GPG_KEY_B64
